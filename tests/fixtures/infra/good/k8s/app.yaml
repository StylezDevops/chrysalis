# A small web service as a careful team would ship it: pinned image, no privilege, limits, probes,
# and a NetworkPolicy that admits only the probe pod. tests/infra_sim.py deploys it to a throwaway
# k3s cluster and verifies it from inside the cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: sim
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: sim
  labels: {app: web}
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: python@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89
          command: ["python", "-m", "http.server", "8080", "--directory", "/usr"]
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 200m, memory: 64Mi}
          readinessProbe:
            httpGet: {path: /, port: 8080}
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /, port: 8080}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: sim
spec:
  selector: {app: web}
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-ingress
  namespace: sim
spec:
  podSelector:
    matchLabels: {app: web}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: {role: probe}
      ports:
        - port: 8080
