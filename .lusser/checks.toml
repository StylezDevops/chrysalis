# Checks for Chrysalis. Each clause has a check that is not a model reading its own code; the
# [critical] clauses C4 and C5 have real-input checks against copies of 4 real repositories.
# Every test here has also been proven able to fail: tests/run_all.py --sweep arms a defect per clause.

[[check]]
clause = "C1"
kind   = "spec-test"
ref    = "tests/test_chrysalis.py"
note   = "SelfCheck: a rule with its Evidence line removed fails `chrysalis.py check`"

[[check]]
clause = "C1"
kind   = "real-input"
ref    = "tests/test_evidence_real.py"
note   = "opens every cited file in the source projects and checks the quoted text is there"

