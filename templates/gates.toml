#
# Pin the toolchain and the tools these gates use (global.json, .nvmrc or engines, .python-version or a
# lock file, rust-toolchain.toml, a local tool manifest instead of global installs), so an unchanged
# codebase cannot fail because an analyser moved under it.
#
# Build and test by stack. Each control is the same command with a known defect switched on.
#   Go:     run = 'go vet ./... && go test -race -count=1 ./...'
#   Rust:   run = 'cargo clippy --all-targets -- -D warnings && cargo test --locked'
#   Java:   run = 'mvn -B -q verify'                   (or: ./gradlew check --warning-mode=fail)
#   .NET:   run = 'dotnet build -warnaserror && dotnet test --no-build'
#
# Infrastructure (K11, when risk.infrastructure is true). Run each tool from a container image pinned by
# digest, against the project's files, with a control that runs it on a planted violation. Prefer a
# control_expect that is the tool's own finding ID (CKV_K8S_16, DL3007) over a phrase: an ID names one
# finding and nothing else. tests/infra_sim.py in the framework runs all of these, with a deploy to a
# throwaway cluster and a rollback.
