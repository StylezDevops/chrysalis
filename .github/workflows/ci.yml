name: CI

# Every gate in gates.toml that can run without local data, on Linux and Windows, with every
# control shown to go red. V1 (real-repository validation) needs local copies of private projects,
# so it runs on the owner's machine only; its last result is in docs/validation.md.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    name: Gates (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Git identity for tests that commit to temporary repositories
        run: |
          git config --global user.name "chrysalis-ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: gates.toml is well formed
        run: python scripts/chrysalis.py gates validate
      - name: Gates pass (T1 tests, S0 sabotage sweep, F1 method check, G1, R1 register, L1 lusser, D1 own doctor)
        run: python scripts/chrysalis.py gates run --only T1 S0 F1 G1 R1 L1 D1
      - name: Every control goes red
        run: python scripts/chrysalis.py gates run --controls --only T1 S0 F1 G1 R1 L1 D1
      - name: Test summary
        if: always()
        run: python tests/run_all.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Gate logs
        if: failure()
        run: for f in .chrysalis/gates/*/*.log .ci-local/*.log; do echo "=== $f"; cat "$f"; done

  infra:
    name: Infrastructure simulation (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - name: Gate I1 and its control (K11, K12 on Kubernetes, Terraform, Bicep, ARM, Dockerfile, Postgres)
        run: python scripts/chrysalis.py gates run --only I1 && python scripts/chrysalis.py gates run --controls --only I1
      - name: Gate logs
        if: failure()
        run: for f in .chrysalis/gates/*/*.log; do echo "=== $f"; cat "$f"; done

  quickstart:
    name: README quick start on an empty project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          path: chrysalis
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - name: Run the README commands
        run: |
          mkdir project && cd project && git init -q
          cp ../chrysalis/config/config_project.example.json config_project.json
          python ../chrysalis/scripts/chrysalis.py validate --config config_project.json
          python ../chrysalis/scripts/chrysalis.py plan .
          python ../chrysalis/scripts/chrysalis.py apply . --home "$RUNNER_TEMP/home"
          python ../chrysalis/scripts/chrysalis.py gates validate --file gates.toml
          test -z "$(git diff --cached --name-only)" || { echo "apply staged files"; exit 1; }
      - name: doctor on the new project fails only on the spec a human must resolve
        run: |
          cd project
          set +e
          python ../chrysalis/scripts/chrysalis.py doctor --repo . > "$RUNNER_TEMP/doctor.txt"
          code=$?
          set -e
          cat "$RUNNER_TEMP/doctor.txt"
          test "$code" = 1
          test "$(grep -c '^FAIL  ' "$RUNNER_TEMP/doctor.txt")" = 1
          grep -q '^FAIL  lusser' "$RUNNER_TEMP/doctor.txt"
      - name: The deferral hook through the real pre-commit framework
        run: |
          python -m pip install --quiet pre-commit==4.7.0
          git config --global user.name "chrysalis-ci"
          git config --global user.email "ci@example.invalid"
          bash chrysalis/tests/precommit_real.sh
      - name: Show what apply wrote
        run: |
          cd project
          {
            echo "## Files apply created in an empty project"
            echo '```'
            find . -path ./.git -prune -o -type f -print | sort
            echo '```'
            echo "## initial.md"
            cat initial.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: example-project
          path: project
          include-hidden-files: true
